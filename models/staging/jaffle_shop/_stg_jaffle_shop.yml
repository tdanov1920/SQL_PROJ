version: 2

models:
  - name: stg_jaffle_shop__customers_1
    description: The grain of this table is one unique customer per row
    columns:
      - name: customer_id
        description: Primary key for the customers table
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders_1
    description: One order per row
    columns:
      - name: order_id
        description: Primary key for the Orders table
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - placed
                  - return_pending
                  - returned
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers_1')
                field: customer_id