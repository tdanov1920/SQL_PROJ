version: 2

sources:
  - name: jaffle_shop
    database: raw
    description: A clone of a Postgres application database.
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customer data.
        columns:
          - name: id
            description: Primary key for the customer data.
            data_tests:
              - unique
              - not_null

      - name: orders
        description: Raw orders data.
        columns:
          - name: id
            description: Primary key for the orders data.
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after:
              count: 6
              period: hour
            error_after:
              count: 12
              period: hour
          loaded_at_field: _etl_loaded_at
